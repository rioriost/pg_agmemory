[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pg-agmemory"
version = "0.0.2"
description = "PostgreSQL-backed agent memory with scoped evidence and deletion"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Rio Fujita"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
pg-agmemory = "pg_agmemory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_agmemory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/pg_agmemory"]
